[project]
name = "secops-triage"
version = "0.1.0"
description = "Triage network telemetry: parse Zeek logs, enrich indicators, find beacons."
readme = "README.md"
authors = [
    { name = "suryatejpattem", email = "75237459+suryatejpattem@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "rich>=15.0.0",
]

[project.scripts]
triage = "secops_triage.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works